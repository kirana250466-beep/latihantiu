=<\/mo><mfrac><mrow><mn>75<\/mn><mo>×<\/mo><mn>65<\/mn><\/mrow><mrow><mn>75<\/mn><mo>−<\/mo><mn>65<\/mn><\/mrow><\/mfrac><mo>×<\/mo><mi>Δ<\/mi><mi>t<\/mi><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mn>150<\/mn><mo>=<\/mo><mfrac><mrow><mn>75<\/mn><mo>×<\/mo><mn>65<\/mn><\/mrow><mn>10<\/mn><\/mfrac><mo>×<\/mo><mi>Δ<\/mi><mi>t<\/mi><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>Δ<\/mi><mi>t<\/mi><mo>=<\/mo><mfrac><mrow><mn>75<\/mn><mo>×<\/mo><mn>65<\/mn><\/mrow><mrow><mn>150<\/mn><mo>×<\/mo><mn>10<\/mn><\/mrow><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mo>=<\/mo><mfrac><mn>13<\/mn><mn>4<\/mn><\/mfrac><mrow><mspace width=\"0.333em\"><\/mspace><mtext mathvariant=\"normal\"> jam<\/mtext><\/mrow><\/mrow><\/math><\/p><p>= 3 jam 15 menit<\/p><p>Nindi berangkat pada pukul = 06.42 + 03.15<\/p><p>= 09.57<\/p><p>Jadi, Nindi berangkat menyusul Purin pada pukul 09.57 WIB.<\/p>","img":""},{"n":11,"kat":"Jurus Jual","teks":"Masha bekerja di sebuah toko dengan upah sebesar Rp850.000,00 per bulan ditambah bonus sebesar 15% dari penjualan toko setiap bulan. Jika bulan Oktober toko tempat Masha bekerja menjual 20 dagangan masing-masing seharga Rp300.000,00 dengan diskon sebesar 10% kepada semua pelanggannya, maka upah yang diterima Masha bulan tersebut sebesar ....","opsi":["Rp1.280.000,00","Rp1.300.000,00","Rp1.420.000,00","Rp1.540.000,00","Rp1.660.000,00"],"sumber":"","kunci":"E","bahas":"<p>Diketahui,<\/p><p>Upah tetap per bulan = 850.000<\/p><p>Diskon <em>d<\/em><sub>1<\/sub> = 10% = 0,1<\/p><p>Harga 20 dagangan = 300.000 × 20 = 6.000.000<\/p><p><strong>Gunakan Jurus Jual!<\/strong><\/p><p>Harga jual = (1 − %rugi) × harga beli<\/p><p>= (1 − 0,1) × Rp6.000.000,00<\/p><p>= 0,9 × Rp6.000.000,00<\/p><p>= Rp5.400.000,00<\/p><p>Bonus yang diterima Masha = 15% × Rp5.400.000 = Rp810.000,00.<\/p><p>Upah Masha bulan Oktober = Upah tetap per bulan + Bonus = 850.000 + 810.000 = 1.660.000<\/p><p>Jadi total upah yang diterima Masha bulan ini adalah Rp1.660.000,00.<\/p>","img":""},{"n":12,"kat":"Jurus Perbandingan 1","teks":"Diketahui dua buah lingkaran masing-masing memiliki diameter 0,21 m dan 14 cm. Perbandingan luas kedua lingkaran tersebut adalah ....","opsi":["1 : 2","2 : 3","3 : 4","4 : 9","5 : 7"],"sumber":"","kunci":"D","bahas":"<p>Diketahui,<\/p><p>Diameter lingkaran <em>x<\/em> = 0,21 m = 21 cm, jari-jari <em>r<sub>x<\/sub><\/em> = <em>r<\/em><sub>1<\/sub> = ½ × 21 = 10,5 cm<\/p><p>Diameter lingkaran <em>y<\/em> = 14 cm, jari-jari <em>r<sub>y<\/sub><\/em> = <em>r<\/em><sub>2<\/sub> = ½ × 14 = 7 cm<\/p><p><strong>Gunakan Jurus Perbandingan 1!<\/strong><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><msub><mi>L<\/mi><mn>1<\/mn><\/msub><msub><mi>L<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><msub><mi>r<\/mi><mn>1<\/mn><\/msub><msub><mi>r<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><msub><mi>L<\/mi><mn>1<\/mn><\/msub><msub><mi>L<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><mtext mathvariant=\"normal\">10,5<\/mtext><mn>7<\/mn><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><msub><mi>L<\/mi><mn>1<\/mn><\/msub><msub><mi>L<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><mn>3<\/mn><mn>2<\/mn><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>=<\/mo><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mrow><\/math><\/p><p>Jadi perbandingan luas kedua lingkaran tersebut adalah 9 : 4 atau 4 : 9.<\/p>","img":""},{"n":13,"kat":"Jurus Perbandingan 1","teks":"Dua buah kubus panjang rusuknya berselisih 3 cm dan luas permukaannya berselisih 240 cm². Panjang rusuk kubus yang lebih besar yang paling mendekati adalah ... cm.","opsi":["6","7","8","9","10"],"sumber":"(USM PKN STAN 2011)","kunci":"C","bahas":"<p>Diketahui,<\/p><p>Panjang rusuk kubus kecil = <em>r<\/em><sub>1<\/sub> = <em>x<\/em><\/p><p>Panjang rusuk kubus besar = <em>r<\/em><sub>2<\/sub> = <em>r<\/em><sub>1<\/sub> + 3 = <em>x<\/em> + 3<\/p><p>Rumus luas permukaan kubus = 6 × sisi × sisi<\/p><p>Luas permukaan kubus kecil = <em>L<\/em><sub>1<\/sub> = 6<em>x<\/em>²<\/p><p>Luas permukaan kubus besar = <em>L<\/em><sub>2<\/sub> = <em>L<\/em><sub>1<\/sub> + 240 cm² = 6<em>x<\/em>² + 240 cm²<\/p><p><strong>Gunakan Jurus Perbandingan 1!<\/strong><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><msub><mi>L<\/mi><mn>1<\/mn><\/msub><msub><mi>L<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><msub><mi>r<\/mi><mn>1<\/mn><\/msub><msub><mi>r<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mrow><mn>6<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>6<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>240<\/mn><\/mrow><\/mfrac><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><mi>x<\/mi><mrow><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><\/mrow><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>40<\/mn><\/mrow><\/mfrac><mo>=<\/mo><mfrac><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>6<\/mn><mi>x<\/mi><mo>+<\/mo><mn>9<\/mn><mo>=<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>40<\/mn><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mn>6<\/mn><mi>x<\/mi><mo>=<\/mo><mn>40<\/mn><mo>−<\/mo><mn>9<\/mn><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>x<\/mi><mo>=<\/mo><mfrac><mn>31<\/mn><mn>6<\/mn><\/mfrac><mo>=<\/mo><mn>5<\/mn><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mrow><mtext mathvariant=\"normal\">Panjang rusuk kubus besar <\/mtext><mspace width=\"0.333em\"><\/mspace><\/mrow><mo>=<\/mo><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mo>=<\/mo><mn>5<\/mn><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><mo>+<\/mo><mn>3<\/mn><mo>=<\/mo><mn>8<\/mn><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/mrow><\/math><\/p><p>Jadi, panjang rusuk kubus yang lebih besar paling mendekati 8 cm.<\/p>","img":""},{"n":14,"kat":"Jurus Perbandingan 2","teks":"Luas daerah G, H, I pada gambar di bawah ini secara berturut-turut adalah 128 cm², 48 cm², dan 30 cm², maka luas daerah F adalah ... cm².<table>\n<colgroup>\n<col style=\"width: 50%\"/>\n<col style=\"width: 50%\"/>\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>G<\/strong><\/td>\n<td><strong>H<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>F<\/strong><\/td>\n<td><strong>I<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>","opsi":["54","60","74","80","100"],"sumber":"(USM PKN STAN 2010)","kunci":"D","bahas":"<p>Diketahui,<\/p><p>Luas daerah G = 128 cm²<\/p><p>Luas daerah H = 48 cm²<\/p><p>Luas daerah I = 30 cm²<\/p><p>Bangun tersebut sebangun, sehingga perbandingan antar sisinya adalah sama.<\/p><p><strong>Gunakan Jurus Perbandingan 2!<\/strong><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mi>F<\/mi><mi>G<\/mi><\/mfrac><mo>=<\/mo><mfrac><mi>I<\/mi><mi>H<\/mi><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>F<\/mi><mo>=<\/mo><mfrac><mrow><mi>G<\/mi><mo>×<\/mo><mi>I<\/mi><\/mrow><mi>H<\/mi><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>F<\/mi><mo>=<\/mo><mfrac><mrow><mn>128<\/mn><mo>×<\/mo><mn>30<\/mn><\/mrow><mn>48<\/mn><\/mfrac><mo>=<\/mo><mn>80<\/mn><\/mrow><\/math><\/p><p>Jadi, luas daerah F adalah 80 cm².<\/p>","img":""},{"n":15,"kat":"Jurus Perbandingan 2","teks":"Ibu membeli 2 kg apel dengan harga Rp45.000,00. Jika ayah ingin membeli 1 kuintal apel yang sama dengan yang dibeli ibu, berapa uang yang harus dibayarkan ayah?","opsi":["Rp2.250.000,00","Rp2.000.000,00","Rp1.850.000,00","Rp1.750.000,00","Rp1.500.000,00"],"sumber":"","kunci":"A","bahas":"<p>Permasalahan tersebut dapat diselesaikan dengan menggunakan konsep perbandingan senilai.<\/p><p><strong>Gunakan Jurus Perbandingan 2!<\/strong><\/p><p>Diketahui,<\/p><p><em>N<sub>i<\/sub><\/em> = 45.000<\/p><p><em>P<sub>i<\/sub><\/em> = 2 kg<\/p><p><em>P<sub>a<\/sub><\/em> = 1 kuintal = 100 kg<\/p><p>Sehingga,<\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><msub><mi>N<\/mi><mi>a<\/mi><\/msub><msub><mi>N<\/mi><mi>i<\/mi><\/msub><\/mfrac><mo>=<\/mo><mfrac><msub><mi>P<\/mi><mi>a<\/mi><\/msub><msub><mi>P<\/mi><mi>i<\/mi><\/msub><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><msub><mi>N<\/mi><mi>a<\/mi><\/msub><mn>45.000<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>100<\/mn><mn>2<\/mn><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msub><mi>N<\/mi><mi>a<\/mi><\/msub><mo>=<\/mo><mn>2.250<\/mn><mn>.000<\/mn><\/mrow><\/math><\/p><p>Jadi, uang yang harus dibayarkan ayah adalah Rp2.250.000,00.<\/p>","img":""},{"n":16,"kat":"Jurus Perbandingan 2","teks":"Jarak kota G dan kota H pada peta dengan skala 1 : 2.000.000 adalah 6 cm. Jika <em>m<\/em> adalah lama waktu tempuh dari kota G ke H dengan kecepatan rata-rata 75 km/jam dan <em>n<\/em> adalah lama waktu yang ditempuh dari kota G ke H dengan kecepatan rata-rata 30 km/jam, maka ....","opsi":["<em>m<\/em> > <em>n<\/em>","2<em>n<\/em> = <em>m<\/em>","3<em>m<\/em> < 2<em>n<\/em>","3<em>n<\/em> > 8<em>m<\/em>","Hubungan <em>m<\/em> dan <em>n<\/em> tidak dapat ditentukan"],"sumber":"","kunci":"C","bahas":"<p>Diketahui,<\/p><p><em>m<\/em> = lama waktu tempuh G ke H dengan <em>v<sub>m<\/sub><\/em> = 75 km/jam<\/p><p><em>n<\/em> = lama waktu tempuh G ke H dengan <em>v<sub>n<\/sub><\/em> = 30 km/jam<\/p><p>Dari rumus kecepatan dimana <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>S<\/mi><mo>=<\/mo><mi>V<\/mi><mo>×<\/mo><mi>t<\/mi><\/mrow><\/math> → <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>t<\/mi><mo>=<\/mo><mfrac><mi>S<\/mi><mi>V<\/mi><\/mfrac><\/mrow><\/math>, maka dengan jarak tempuh (<em>S<\/em>) didapatkan<\/p><p>Untuk <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>m<\/mi><mo>=<\/mo><mfrac><mi>S<\/mi><msub><mi>v<\/mi><mi>m<\/mi><\/msub><\/mfrac><\/mrow><\/math> dan <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>n<\/mi><mo>=<\/mo><mfrac><mi>S<\/mi><msub><mi>v<\/mi><mi>n<\/mi><\/msub><\/mfrac><\/mrow><\/math><\/p><p>Sehingga perbandingan antara waktu tempuh <em>m<\/em> dan <em>n<\/em> yaitu,<\/p><p><strong>Gunakan Jurus Perbandinga /strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><\/td>\n<td><strong>−0,5<\/strong><\/td>\n<td><\/td>\n<td><strong>+1<\/strong><\/td>\n<td><\/td>\n<td><strong>−1,5<\/strong><\/td>\n<td><\/td>\n<td><strong>+2<\/strong><\/td>\n<td><\/td>\n<td><strong>−2,5<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>Jadi, suku selanjutnya adalah −0,5.<\/p>","img":""},{"n":22,"kat":"Latihan Soal","teks":"Diketahui perbandingan volume dua buah kubus adalah 1 : 8, maka perbandingan luas permukaan kedua kubus tersebut adalah ....","opsi":["1 : 6","1 : 8","1 : 3","1 : 4","2 : 3"],"sumber":"","kunci":"D","bahas":"<p>Diketahui,<\/p><p>Perbandingan volume dua buah kubus = 1 : 8, dengan <em>r<\/em> adalah panjang rusuk kubus.<\/p><p><strong>Gunakan Jurus Perbandingan 1!<\/strong><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><msub><mi>V<\/mi><mn>1<\/mn><\/msub><msub><mi>V<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><msub><mi>r<\/mi><mn>1<\/mn><\/msub><msub><mi>r<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>3<\/mn><\/msup><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mn>1<\/mn><mn>8<\/mn><\/mfrac><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><msub><mi>r<\/mi><mn>1<\/mn><\/msub><msub><mi>r<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>3<\/mn><\/msup><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><msub><mi>r<\/mi><mn>1<\/mn><\/msub><msub><mi>r<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mrow><\/math><\/p><p>Sehingga,<\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><msub><mi>L<\/mi><mn>1<\/mn><\/msub><msub><mi>L<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><msub><mi>r<\/mi><mn>1<\/mn><\/msub><msub><mi>r<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>=<\/mo><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><\/mrow><\/math><\/p><p>Jadi perbandingan luas permukaan kedua kubus tersebut adalah 1 : 4.<\/p>","img":""},{"n":23,"kat":"Latihan Soal","teks":"Sebuah mesin pengemas nata dengan kecepatan konstan dapat menghasilkan nata kemasan sebanyak 32450 bungkus dalam waktu 2 jam. Berapa banyak nata yang mampu dibungkus dalam waktu 8 jam?","opsi":["8/32450 = 2/<em>x<\/em>","2/8 = 2<em>x<\/em>/129800","8/2 = 32450/<em>x<\/em>","<em>x<\/em> = 129800","4<em>x<\/em> = 32450"],"sumber":"","kunci":"D","bahas":"<p>Diketahui,<\/p><p>Lama waktu pertama = <em>P<sub>a<\/sub><\/em> = 2 jam<\/p><p>Lama waktu kedua = <em>P<sub>i<\/sub><\/em> = 8 jam<\/p><p>Hasil kemasan pertama = <em>N<sub>a<\/sub><\/em> = 32450 bungkus<\/p><p>Hasil kemasan kedua = <em>N<sub>i<\/sub><\/em> = <em>x<\/em><\/p><p><strong>Gunakan Jurus Perbandingan 2!<\/strong><\/p><p>Karena merupakan perbandingan senilai maka,<\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><msub><mi>N<\/mi><mi>a<\/mi><\/msub><msub><mi>N<\/mi><mi>i<\/mi><\/msub><\/mfrac><mo>=<\/mo><mfrac><msub><mi>P<\/mi><mi>a<\/mi><\/msub><msub><mi>P<\/mi><mi>i<\/mi><\/msub><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mn>32450<\/mn><mi>x<\/mi><\/mfrac><mo>=<\/mo><mfrac><mn>2<\/mn><mn>8<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>x<\/mi><mo>=<\/mo><mn>32450<\/mn><mo>×<\/mo><mn>4<\/mn><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>x<\/mi><mo>=<\/mo><mn>129800<\/mn><\/mrow><\/math><\/p><p>Jadi, banyak nata kemasan yang dihasilkan sebanyak <em>x<\/em> = 129800 bungkus.<\/p>","img":""},{"n":24,"kat":"Latihan Soal","teks":"Perbandingan jari-jari dua buah bola <em>p<\/em> dan <em>q<\/em> secara berurutan adalah 2 : 3. Jika <em>x<\/em> adalah volume <em>q<\/em> dan <em>y<\/em> adalah volume <em>p<\/em>, maka pernyataan berikut yang sesuai yaitu ....","opsi":["<em>x<\/em> > <em>y<\/em>","<em>x<\/em> < <em>y<\/em>","<em>x<\/em> = <em>y<\/em>","<em>x<\/em> = 2<em>y<\/em>","Hubungan <em>x<\/em> dan <em>y<\/em> tidak dapat ditentukan"],"sumber":"","kunci":"A","bahas":"<p>Diketahui,<\/p><p>Volume bola <em>p<\/em> = <em>V<sub>p<\/sub><\/em> = <em>y<\/em><\/p><p>Volume bola <em>q<\/em> = <em>V<sub>q<\/sub><\/em> = <em>x<\/em><\/p><p>Perbandingan jari-jari bola <em>p<\/em> dan <em>q<\/em> = <em>r<sub>p<\/sub><\/em> : <em>r<sub>q<\/sub><\/em> = 2 : 3<\/p><p><strong>Gunakan Jurus Perbandingan 1!<\/strong><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><msub><mi>V<\/mi><mn>1<\/mn><\/msub><msub><mi>V<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><msub><mi>r<\/mi><mn>1<\/mn><\/msub><msub><mi>r<\/mi><mn>2<\/mn><\/msub><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>3<\/mn><\/msup><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mi>x<\/mi><mi>y<\/mi><\/mfrac><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><mn>3<\/mn><mn>2<\/mn><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>3<\/mn><\/msup><mo>=<\/mo><mfrac><mn>27<\/mn><mn>8<\/mn><\/mfrac><\/mrow><\/math><\/p><p>Sehingga diperoleh:<\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>x<\/mi><mo>=<\/mo><mfrac><mn>27<\/mn><mn>8<\/mn><\/mfrac><mi>y<\/mi><\/mrow><\/math><\/p><p>Karena 27/8 lebih besar dari 1, maka <em>x<\/em> &gt; <em>y<\/em>.<\/p>","img":""},{"n":25,"kat":"Latihan Soal","teks":"Jarak kota R dan kota S dalam peta dengan skala 1 : 1.000.000 adalah 12 cm. Jika <em>y<\/em> adalah lama waktu tempuh dari kota S ke R dengan kecepatan rata-rata 30 km/jam dan <em>x<\/em> adalah lama waktu yang ditempuh dari kota R ke S dengan kecepatan rata-rata 75 km/jam, maka ....","opsi":["<em>x<\/em> > <em>y<\/em>","2<em>y<\/em> = <em>x<\/em>","3<em>x<\/em> < 2<em>y<\/em>","3<em>y<\/em> > 8<em>x<\/em>","Hubungan <em>x<\/em> dan <em>y<\/em> tidak dapat ditentukan"],"sumber":"","kunci":"C","bahas":"<p>Diketahui,<\/p><p><em>y<\/em> = lama waktu tempuh dari S ke R dengan <em>v<sub>y<\/sub><\/em> = 30 km/jam<\/p><p><em>x<\/em> = lama waktu tempuh dari R ke S dengan <em>v<sub>x<\/sub><\/em> = 75 km/jam<\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>S<\/mi><mo>=<\/mo><mi>v<\/mi><mo>×<\/mo><mi>t<\/mi><mrow><mspace width=\"0.333em\"><\/mspace><mtext mathvariant=\"normal\"> → <\/mtext><mspace width=\"0.333em\"><\/mspace><\/mrow><mi>t<\/mi><mo>=<\/mo><mfrac><mi>S<\/mi><mi>v<\/mi><\/mfrac><\/mrow><\/math><\/p><p>Jarak tempuh (<em>S<\/em>) kedua perjalanan sama, sehingga didapatkan:<\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>x<\/mi><mo>=<\/mo><mfrac><mi>S<\/mi><msub><mi>v<\/mi><mi>x<\/mi><\/msub><\/mfrac><mrow><mspace width=\"0.333em\"><\/mspace><mtext mathvariant=\"normal\"> dan <\/mtext><mspace width=\"0.333em\"><\/mspace><\/mrow><mi>y<\/mi><mo>=<\/mo><mfrac><mi>S<\/mi><msub><mi>v<\/mi><mi>y<\/mi><\/msub><\/mfrac><\/mrow><\/math><\/p><p>Sehingga perbandingan antara waktu tempuh <em>x<\/em> dan <em>y<\/em> yaitu,<\/p><p><strong>Gunakan Jurus Perbandingan 2!<\/strong><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mi>x<\/mi><mi>y<\/mi><\/mfrac><mo>=<\/mo><mfrac><msub><mi>v<\/mi><mi>y<\/mi><\/msub><msub><mi>v<\/mi><mi>x<\/mi><\/msub><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mo>=<\/mo><mfrac><mn>30<\/mn><mn>75<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>2<\/mn><mn>5<\/mn><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mn>5<\/mn><mi>x<\/mi><mo>=<\/mo><mn>2<\/mn><mi>y<\/mi><mrow><mspace width=\"0.333em\"><\/mspace><mtext mathvariant=\"normal\"> → <\/mtext><mspace width=\"0.333em\"><\/mspace><\/mrow><mn>3<\/mn><mi>x<\/mi><mo>&lt;<\/mo><mn>2<\/mn><mi>y<\/mi><\/mrow><\/math><\/p><p>Jadi pernyataan yang sesuai adalah 3<em>x<\/em> &lt; 2<em>y<\/em>.<\/p>","img":""},{"n":26,"kat":"Latihan Soal","teks":"Jika suatu pekerjaan dikerjakan oleh Eka dan Fani maka akan selesai dalam 4 hari. Jika dikerjakan oleh Fani dan Gantang akan selesai dalam 6 hari. Jika dikerjakan oleh Eka dan Gantang maka akan selesai dalam waktu 8 hari. Butuh waktu berapa hari, jika pekerjaan tersebut hanya dikerjakan oleh Eka?","opsi":["9,6 hari","10 hari","10,2 hari","10,8 hari","12 hari"],"sumber":"","kunci":"A","bahas":"<p>Misal,<\/p><p>Waktu yang dibutuhkan Eka = <em>e<\/em><\/p><p>Waktu yang dibutuhkan Fani = <em>f<\/em><\/p><p>Waktu yang dibutuhkan Gantang = <em>g<\/em><\/p><p>Maka,<\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mn>1<\/mn><mi>e<\/mi><\/mfrac><mo>+<\/mo><mfrac><mn>1<\/mn><mi>f<\/mi><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><mrow><mspace width=\"0.333em\"><\/mspace><mtext mathvariant=\"normal\"> … (i)<\/mtext><\/mrow><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mn>1<\/mn><mi>f<\/mi><\/mfrac><mo>+<\/mo><mfrac><mn>1<\/mn><mi>g<\/mi><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><mrow><mspace width=\"0.333em\"><\/mspace><mtext mathvariant=\"normal\"> … (ii)<\/mtext><\/mrow><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mn>1<\/mn><mi>e<\/mi><\/mfrac><mo>+<\/mo><mfrac><mn>1<\/mn><mi>g<\/mi><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>8<\/mn><\/mfrac><mrow><mspace width=\"0.333em\"><\/mspace><mtext mathvariant=\"normal\"> … (iii)<\/mtext><\/mrow><\/mrow><\/math><\/p><p>Eliminasi <em>f<\/em> dari persamaan (i) dan (ii), yaitu persamaan (i) dikurangi persamaan (ii),<\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mn>1<\/mn><mi>e<\/mi><\/mfrac><mo>−<\/mo><mfrac><mn>1<\/mn><mi>g<\/mi><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><mo>−<\/mo><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mn>1<\/mn><mi>e<\/mi><\/mfrac><mo>−<\/mo><mfrac><mn>1<\/mn><mi>g<\/mi><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>12<\/mn><\/mfrac><mrow><mspace width=\"0.333em\"><\/mspace><mtext mathvariant=\"normal\"> … (iv)<\/mtext><\/mrow><\/mrow><\/math><\/p><p>Dari persamaan (iii) dan (iv), yaitu persamaan (iii) ditambah persamaan (iv),<\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mn>2<\/mn><mi>e<\/mi><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>8<\/mn><\/mfrac><mo>+<\/mo><mfrac><mn>1<\/mn><mn>12<\/mn><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mn>2<\/mn><mi>e<\/mi><\/mfrac><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mo>+<\/mo><mn>2<\/mn><\/mrow><mn>24<\/mn><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mfrac><mn>2<\/mn><mi>e<\/mi><\/mfrac><mo>=<\/mo><mfrac><mn>5<\/mn><mn>24<\/mn><\/mfrac><\/mrow><\/math><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>e<\/mi><mo>=<\/mo><mfrac><mn>24<\/mn><mn>5<\/mn><\/mfrac><mo>×<\/mo><mn>2<\/mn><mo>=<\/mo><mtext mathvariant=\"normal\">9,6<\/mtext><\/mrow><\/math><\/p><p>Jadi, jika pekerjaan tersebut hanya dikerjakan oleh Eka, maka membutuhkan waktu selama 9,6 hari.<\/p>","img":""},{"n":27,"kat":"Penalaran Logis","teks":"Semua murid SMA harus memiliki Kartu Pelajar. Signi adalah petugas yang membuat Kartu Pelajar. Fikan mempunyai Kartu Pelajar.","opsi":["Pemilik Kartu Pelajar harus murid SMA","Fikan pernah bertemu dengan Signi","Semua murid SMA sudah bertemu dengan Signi","Kartu Pelajar milik Fikan untuk menjadi murid SMA","Tidak dapat disimpulkan"],"sumber":"","kunci":"C","bahas":"<p>Ubah pernyataan menjadi bentuk sederhana:<\/p><p>(1) Murid SMA → punya Kartu Pelajar<\/p><p>(2) Kartu Pelajar → dibuat oleh Signi<\/p><p>(3) Fikan → punya Kartu Pelajar<\/p><p>Gabungkan pernyataan (1) dan (2): murid SMA → punya Kartu Pelajar → dibuat oleh Signi. Artinya, setiap murid SMA memiliki Kartu Pelajar buatan Signi, sehingga semua murid SMA sudah berurusan (bertemu) dengan Signi.<\/p><p>Periksa opsi lain:<\/p><p><strong>A<\/strong> salah, karena terbalik. Yang pasti: murid SMA punya Kartu Pelajar, bukan sebaliknya, sebab belum tentu semua pemilik Kartu Pelajar adalah murid SMA.<\/p><p><strong>B<\/strong> tidak pasti, karena Fikan hanya disebut mempunyai Kartu Pelajar dan tidak disebut sebagai murid SMA, sehingga aturan pada pernyataan (1) tidak bisa dipakai untuk Fikan.<\/p><p><strong>D<\/strong> tidak ada dasarnya pada pernyataan di atas.<\/p><p>Jadi, kesimpulan yang tepat adalah opsi C.<\/p>","img":""},{"n":28,"kat":"Penalaran Logis","teks":"Tidak ada koala yang karnivora. Hewan berkantung hanya makan rumput.","opsi":["Hewan berkantung adalah koala","Koala bukan hewan berkantung","Hewan berkantung bukan koala yang karnivora","Koala adalah hewan berkantung omnivora","Tidak dapat disimpulkan"],"sumber":"","kunci":"E","bahas":"<p>Ubah pernyataan menjadi bentuk sederhana:<\/p><p>(1) Koala → bukan karnivora<\/p><p>(2) Hewan berkantung → hanya makan rumput<\/p><p>Kedua pernyataan tidak memiliki penghubung, karena tidak ada kalimat yang menyebutkan bahwa koala termasuk atau tidak termasuk hewan berkantung. Tanpa penghubung, kedua pernyataan tidak bisa digabungkan menjadi kesimpulan baru.<\/p><p>Periksa opsi:<\/p><p><strong>A<\/strong>, <strong>B<\/strong>, dan <strong>D<\/strong> menyebutkan hubungan koala dengan hewan berkantung, padahal hubungan itu tidak disebutkan di soal. Opsi D juga bertentangan dengan pernyataan (2), karena hewan berkantung hanya makan rumput.<\/p><p><strong>C<\/strong> tidak menghubungkan koala dengan hewan berkantung. Isinya hanya kembali ke pernyataan (1) bahwa tidak ada koala yang karnivora, jadi bukan kesimpulan baru dari gabungan kedua pernyataan.<\/p><p>Jadi, tidak ada kesimpulan yang bisa ditarik, yaitu opsi E.<\/p>","img":""},{"n":29,"kat":"Penalaran Logis","teks":"Semua kendaraan bermotor yang menggunakan bahan bakar fosil dan mengeluarkan gas CO pasti menimbulkan polusi udara. Sepeda tidak menimbulkan polusi udara.","opsi":["Mungkin sepeda bukan kendaraan bermotor","Sepeda pasti tidak menggunakan bahan bakar fosil","Sepeda pasti tidak mengeluarkan gas CO","Sepeda tidak menggunakan bahan bakar fosil atau tidak mengeluarkan gas CO","Tidak dapat disimpulkan"],"sumber":"","kunci":"D","bahas":"<p>Ubah pernyataan menjadi bentuk “jika … maka …”:<\/p><p>(1) Jika (memakai bahan bakar fosil <strong>dan<\/strong> mengeluarkan gas CO) maka menimbulkan polusi udara<\/p><p>(2) Sepeda tidak menimbulkan polusi udara<\/p><p>Gunakan <strong>kontraposisi<\/strong>: “jika P maka Q” sama artinya dengan “jika bukan Q maka bukan P”. Karena sepeda tidak menimbulkan polusi udara (bukan Q), maka sepeda tidak memenuhi syarat P, yaitu <strong>bukan<\/strong> (memakai bahan bakar fosil dan mengeluarkan gas CO).<\/p><p>Kebalikan dari “A <strong>dan<\/strong> B” adalah “bukan A <strong>atau<\/strong> bukan B”. Sehingga sepeda tidak memakai bahan bakar fosil <strong>atau<\/strong> tidak mengeluarkan gas CO.<\/p><p>Opsi B dan C terlalu pasti, sebab yang pasti hanya salah satunya (atau keduanya) tidak terpenuhi. Opsi A tidak diturunkan dari pernyataan di atas.<\/p><p>Jadi, kesimpulan yang tepat adalah opsi D.<\/p>","img":""},{"n":30,"kat":"Penalaran Logis","teks":"Terdapat lima orang sahabat yaitu: Epa, Lia, Raka, Rina, dan Nasar. Mereka sekolah di satu kelas yang sama dan saling bersaing satu sama lain. Rina adalah siswa yang paling pandai di kelasnya. Epa kalah pandai dibanding Lia, tetapi Lia sama pandainya dengan Raka. Raka lebih pandai dari Nasar. Berdasarkan situasi di atas, pernyataan yang pasti benar adalah ....","opsi":["Epa lebih pandai daripada Nasar","Lia lebih pandai daripada Nasar","Tingkat kepandaian Lia berada di urutan ke tiga","Nasar lebih pandai daripada Lia","Tingkat kepandaian Epa berada di urutan ke empat"],"sumber":"","kunci":"B","bahas":"<p>Ubah informasi menjadi simbol (tanda “&gt;” berarti lebih pandai):<\/p><p>Rina paling pandai: Rina &gt; semua yang lain<\/p><p>Epa kalah pandai dari Lia: Epa &lt; Lia<\/p><p>Lia sama pandai dengan Raka: Lia = Raka<\/p><p>Raka lebih pandai dari Nasar: Raka &gt; Nasar<\/p><p>Dari Lia = Raka dan Raka &gt; Nasar, maka Lia &gt; Nasar.<\/p><p>Urutan kepandaian: <strong>Rina &gt; Lia = Raka &gt; Epa dan Nasar<\/strong> (Epa dan Nasar sama-sama di bawah Lia dan Raka, tetapi mana yang lebih pandai di antara keduanya tidak diketahui).<\/p><p>Periksa opsi:<\/p><p><strong>A<\/strong> belum pasti, karena Epa dan Nasar tidak dibandingkan secara langsung.<\/p><p><strong>B<\/strong> pasti benar, karena Lia &gt; Nasar.<\/p><p><strong>C<\/strong> salah, karena Lia sama pandai dengan Raka dan hanya di bawah Rina, sehingga Lia berada di urutan ke dua (bersama Raka).<\/p><p><strong>D<\/strong> salah, karena Lia lebih pandai dari Nasar.<\/p><p><strong>E<\/strong> belum pasti, karena Epa bisa berada di urutan ke empat atau ke lima, tergantung perbandingannya dengan Nasar.<\/p><p>Jadi, pernyataan yang pasti benar adalah opsi B.<\/p>","img":""},{"n":31,"kat":"Jurus Rotasi Gambar","teks":"","opsi":null,"sumber":"(USM PKN STAN 2014)","kunci":"E","bahas":"<p>Perhatikan dengan seksama sebagai titik acuan yaitu posisi <strong>bulatan hitam<\/strong> pada gambar dalam kotak.<\/p><p>Opsi A salah karena ketika dirotasi 180°, bulatan hitam menjadi berubah posisi.<\/p><p>Opsi B dan D salah karena ketika dirotasi 90°, bulatan hitam menjadi berubah posisi.<\/p><p>Opsi C salah karena ketika dirotasi hanya gambar bulatan hitam yang sesuai posisinya.<\/p><p>Jadi, opsi yang tepat adalah opsi E yaitu bangun <strong>dirotasi sebesar 180°<\/strong>.<\/p>","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABsIAAAFeCAAAAAAa7FUiAADv1UlEQVR42uydeXxU5fX/35P7hHvhDpmQxABhjRIFAY2CgmKhgmJdsNpK1YoVq61brVattXax2lZrrf1qq21ttbV1r7tUrCgoVCwoSJRgokECCQQyMkMmzIV7k+fO/P6YSTI7ySQMob/7efVVyazPPMv5nHOes7jCOHDgwIEDBwcj8pwpcODAgQMHDoU5cODAgQMHDoU5cODAgQMHDoU5cODAgQOHwhw4cODAgQOHwhw4cODAgQOHwhw4cODAgUNhDhw4cODAgUNhDhw4cODAgUNhDhw4cODAgUNhDhw4cODAoTAHDhw4cODAoTAHDhw4cODAoTAHDhw4cOBQmAMHDhw4cOBQmAMHDhw4cOBQmAMHDhw4cOBQmAMHDhw4cCjMgQMHDhw4cCjMgQMHDhw4cCjMgQMHDhw4FObAgQMHDhw4FObAgQMHDhw4FObAgQMHDhw4FObAgQMHDhwKc+DAgQMHEex1psChMAcOHDg4OGHtPhDfGnIozIEDBw4c9BaKlhtjr92ZahDOFDhw4MBBX0rV/Jx8jZSKY4I4VpgDBw4c9CVCOTIMVGl1OA9DgP3/52y7ws6Oc+DAgYM+Qzu5scIIdVkgof9vrRGHwhw4cODAwUEKx5HowIEDB/0EoZAzBw6FOXDgwEHv0N6SkN2VI3+VI5GdCXPgwIGDXiEcNqyE8Ai5T/uoLywoRyA7M+bAgQMHvWMwU6oFOkBLENp37gWUfUb82Zlf4bgI9wucvDAHDhw4iLe4hBAugHZpKRj2QCAvr112JHyFUqr+MXGIHS9oz+8zcyHkmBsOhTlw4MDBvhEbFG+jR4ttSEtGn8jbB590GlxK340pzyE0h8IcOHDgYF8Iu2L+UJXOWhtCat20qPL6yPLqLqE5FObAgQMHDgCIYTAhVK3zz3ynnlM/hLMmDhw4cJCGzaJ3YvtHWqYLYczYrCXU9j9g5zoU5sCBAwf7S8Lu7ZSxau9qRbWHspC+mTkq0Lr3oI9tdDkU5sCBAwf7C8IMRkksKwZrT/pHj8TvgIGZ3qMq5v+A1O47O8ypkejAgQMHCRLWUOJ5JLsIwHY5cL8ML2SpPRhP2PW/vFSOFebAgQMHCap9XDR8++60t1OZfXr5ajbv2jek7Ing7p8M1lfGkxOR6MCBAwcJGNjeZcCEAgzuls2V3z0TIZTasAqoQ7o7ugH/C1qCQ2EOHDhwsJ+QD4RdETkr0mco5yW8pTvIS8Vh0jAsMbi7oxvgLFBGLcGBAwcO/r+HjApJXe/7z06kMRuhyL7/mn4d69Ang3OsMAcOHDjYl0XWW8KKMRbabMVGGQBtDCASKdImVFRln9K450El/TqSo08G50QkOnDg4P93hGVPaSpkDO4JqcS+bq+UGqrEQigDIuy2V3X8YQ6FOXDgwEGWHNZji6BnFlFI const T=n=>n<=5?30:n<=30?210:60,LK='tpa7:',A=document.getElementById('app'),now=()=>Date.now();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,S=undefined,P=null,nama='',uid='',guru=false,owner=false,canW=true,view='login',stu=[],note='',armed='',chain=Promise.resolve(),subP=false;
const inact=()=>S?(S.pz||0)+(S.pzAt?now()-S.pzAt:0):0;
const fresh=()=>({nama,e:S?S.epoch:0,i:0,a:{},t0:null,ip0:0,u:0});
const slug=s=>s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x'+[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7).toString(36);
const fmt=r=>{const s=Math.ceil(r);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function sc(p){let b=0,s=0,h=0;Q.forEach((q,k)=>{const v=p.a&&p.a[k];if(v===undefined)return;if(v==='-')h++;else if(v===q.kunci)b++;else s++});return{b,s,h}}
function lget(){try{return JSON.parse(localStorage.getItem(LK+uid))}catch(e){return null}}
function save(){
  P.u=now();const d=JSON.parse(JSON.stringify(P));
  try{localStorage.setItem(LK+uid,JSON.stringify(d))}catch(e){}
  if(db&&canW)chain=chain.then(()=>db.doc('progres/'+uid).set(d)).catch(e=>{if(e&&e.code==='invalid_argument')canW=false});
}
function sync(){if(S&&P&&P.e!==S.epoch){P=fresh();save()}}
function ensureT(){if(S&&S.status==='on'&&P&&P.i<Q.length&&P.a[P.i]===undefined&&P.t0==null){P.t0=now();P.ip0=inact();save()}}
const rem=q=>Math.max(0,T(q.n)-(now()-P.t0-(inact()-P.ip0))/1000);

async function login(raw){
  nama=raw.trim().replace(/\s+/g,' ').slice(0,40);if(!nama)return;
  try{localStorage.setItem(LK+'last',nama)}catch(e){}
  guru=nama.toLowerCase()==='ferdi';uid=slug(nama);
  if(guru){view='guru';P=null;render();subStu();return}
  view='quiz';P=null;render();
  const L=lget();let R=null;
  if(db){try{const s=await db.doc('progres/'+uid).get();if(s.exists)R=JSON.parse(JSON.stringify(s.data()))}catch(e){}}
  P=(R&&(!L||(R.u||0)>=(L.u||0)))?R:L;
  if(!P)P=fresh();else P.nama=nama;
  sync();render();
}
function logout(){view='login';P=null;guru=false;render()}
function subStu(){
  if(!db||subP)return;subP=true;
  db.collection('progres').onSnapshot(sn=>{stu=sn.docs.map(d=>d.data());rStu()},()=>{});
}
function jawab(h){
  if(!S||S.status!=='on'||!P||P.i>=Q.length||P.a[P.i]!==undefined||P.t0==null)return;
  const q=Q[P.i];P.a[P.i]=rem(q)<=0?'-':h;save();render();
}
function lanjut(){P.i++;P.t0=null;ensureT();if(P.t0==null)save();render()}
async function ctl(a){
  if(!db||!owner||!S)return;
  if(a==='mulai'&&armed!=='mulai'){armed='mulai';rCtl();setTimeout(()=>{armed='';rCtl()},4000);return}
  armed='';const n=now(),ep=S.epoch||0;let s;
  if(a==='mulai')s={status:'on',epoch:ep+1,pz:0,pzAt:null};
  else if(a==='aktif'||(a==='jeda'&&S.status==='paused'))s={status:'on',epoch:ep,pz:(S.pz||0)+(S.pzAt?n-S.pzAt:0),pzAt:null};
  else if(a==='jeda')s={status:'paused',epoch:ep,pz:S.pz||0,pzAt:n};
  else s={status:'off',epoch:ep,pz:S.pz||0,pzAt:S.pzAt||n};
  s.u=n;note='';
  try{await db.doc('sesi/kelas').set(s)}catch(e){note='Gagal menyimpan: '+((e&&e.code)||'error');rCtl()}
}

function hdr(){return`<div class="row sp" style="margin-bottom:10px"><b>${esc(nama)}</b>${db&&!canW&&!guru?'<span class="mut" style="font-size:.8rem">Progres tersimpan di perangkat ini</span>':''}<button class="btn" data-a="out">Keluar</button></div>`}
function lock(t,m){A.innerHTML=hdr()+`<div class="c"><h2>${t}</h2><p class="mut">${m}</p></div>`}
function render(){view==='login'?rLogin():view==='guru'?rGuru():rQuiz()}
function rLogin(){
  let last='';try{last=localStorage.getItem(LK+'last')||''}catch(e){}
  A.innerHTML=`<div class="c"><h1>Kuis TPA</h1><p class="mut">7 Jurus Terlarang · 35 soal</p><label for="nm">Nama kamu</label><input id="nm" maxlength="40" autocomplete="off" value="${esc(last)}" placeholder="Tulis nama bebas"><button class="btn p" data-a="login">Masuk</button><p class="mut" style="font-size:.9rem">Masuk lagi dengan nama yang sama untuk melanjutkan ke soal berikutnya.</p></div>`;
}
function rQuiz(){
  if(S===undefined||!P){A.innerHTML=hdr()+'<div class="c">Menghubungkan ke kelas…</div>';return}
  if(S===null){lock('Belum terhubung ke kelas','Buka tautan dari guru dengan akun yang diundang, lalu muat ulang halaman ini.');return}
  if(P.i>=Q.length){rDone();return}
  if(S.status==='off'){lock('Sesi belum dimulai','Guru belum mengaktifkan sesi. Halaman ini terbuka otomatis saat sesi dimulai.');return}
  ensureT();
  const q=Q[P.i],h=P.a[P.i],ans=h!==undefined,pz=S.status==='paused',lim=T(q.n),r=P.t0==null?lim:rem(q),c=sc(P);
  const op=(q.opsi||['','','','','']).map((o,k)=>{const L='ABCDE'[k];let x='';if(ans){if(L===q.kunci)x=' ok';else if(L===h)x=' bad'}return`<button class="op${x}" data-h="${L}"${ans||pz?' disabled':''}><b>${L}.</b><span>${o}</span></button>`}).join('');
  let fb='';
  if(ans){const ok=h===q.kunci;fb=`<div class="hint" style="background:var(--${ok?'okb':'badb'});color:var(--${ok?'ok':'bad'})"><b>${ok?'Benar!':h==='-'?'Waktu habis.':'Salah.'}</b>${ok?'':' Jawaban yang benar: '+q.kunci+'.'}</div><button class="btn p" data-a="next">${P.i+1>=Q.length?'Lihat hasil':'Lanjut →'}</button>`}
  A.innerHTML=hdr()+`<div class="row sp"><span>Soal <b>${q.n}</b> dari ${Q.length}</span><span class="chip">${esc(q.kat)}</span><span class="mut">Benar ${c.b} · Salah ${c.s+c.h}</span></div>`
   +(ans?'':`<div class="row sp"><span class="mut">Sisa waktu</span><b id="tm">${fmt(r)}</b></div><div class="bar"><i id="tb" class="${r<=10?'lo':''}" style="width:${r/lim*100}%"></i></div>`)
   +(pz?'<div class="hint" style="background:var(--warnb);color:var(--warn)">Sesi dijeda guru. Timer berhenti, tunggu guru melanjutkan.</div>':'')
   +`<div class="c q" style="margin-top:8px">${q.img?`<img src="${q.img}" alt="Soal ${q.n}"><p class="mut">Pilih pilihan yang paling tepat untuk melengkapi analogi di atas.</p>`:q.teks}</div>${op}${fb}`;
}
function rDone(){
  const c=sc(P);
  A.innerHTML=hdr()+`<div class="c"><h1>Selesai</h1><p>Benar <b>${c.b}</b> dari ${Q.length} soal. Salah ${c.s}, waktu habis ${c.h}.</p><div class="row">${Q.map((q,k)=>{const v=P.a[k];const ok=v===q.kunci;return`<span class="chip ${ok?'on':'of'}">${q.n}${ok?' ✓':v==='-'?' ⏱':' ✗'}</span>`}).join('')}</div></div>`;
}
function rGuru(){
  A.innerHTML=hdr()+`<div class="c"><h2>Kontrol kelas</h2><div id="ctl"></div></div><div class="c"><h2>Progres siswa (sesi ini)</h2><div id="st"></div></div><h2>Soal dan pembahasan</h2>`
   +Q.map(q=>`<div class="c q"><div class="row sp"><b>Soal ${q.n}</b><span class="chip">${esc(q.kat)}</span></div>${q.img?`<img src="${q.img}" alt="Soal ${q.n}">`:q.teks}${q.opsi?q.opsi.map((o,k)=>`<div class="op${'ABCDE'[k]===q.kunci?' ok':''}"><b>${'ABCDE'[k]}.</b><span>${o}</span></div>`).join(''):''}<p><b>Kunci: ${q.kunci}</b> ${q.sumber?`<span class="mut">${esc(q.sumber)}</span>`:''}</p><div class="bh"><b>Pembahasan</b>${q.bahas}</div></div>`).join('');
  rCtl();rStu();
}
function rCtl(){
  const e=document.getElementById('ctl');if(!e)return;
  if(S===null){e.innerHTML='<p class="mut">Kontrol kelas tidak tersedia di tampilan ini (butuh akses data bersama).</p>';return}
  if(!S){e.innerHTML='<p class="mut">Menghubungkan…</p>';return}
  const st=S.status,d=owner?'':' disabled';
  e.innerHTML=`<p>Halaman siswa: <span class="chip ${{on:'on',paused:'ps',off:'of'}[st]}">${{on:'Aktif',paused:'Dijeda',off:'Mati'}[st]}</span> <span class="mut">${S.epoch?'Sesi ke-'+S.epoch:'Belum ada sesi'}</span></p><div class="row"><button class="btn p" data-a="mulai"${d}>${armed==='mulai'?'Yakin? Klik lagi':'Mulai baru'}</button>`
   +(st==='off'&&S.epoch>0?`<button class="btn" data-a="aktif"${d}>Aktifkan kembali</button>`:'')
   +(st!=='off'?`<button class="btn" data-a="jeda"${d}>${st==='paused'?'Lanjutkan':'Jeda'}</button><button class="btn" data-a="mati"${d}>Matikan</button>`:'')
   +`</div><p class="mut" style="font-size:.85rem">Mulai baru: sesi baru dengan progres siswa dari nol. Aktifkan kembali: lanjut sesi yang sama.</p>`
   +(owner?'':'<p style="color:var(--warn)">Kontrol hanya berfungsi bila halaman dibuka oleh akun pemilik.</p>')+(note?`<p style="color:var(--bad)">${esc(note)}</p>`:'');
}
function rStu(){
  const e=document.getElementById('st');if(!e)return;
  const L=stu.filter(x=>S&&x.e===S.epoch);
  if(!L.length){e.innerHTML='<p class="mut">Belum ada siswa pada sesi ini.</p>';return}
  e.innerHTML='<table class="t"><tr><th>Nama</th><th>Soal</th><th>Benar</th><th>Salah</th><th>Habis</th></tr>'+L.map(x=>{const c=sc(x);return`<tr><td>${esc(x.nama||'')}</td><td>${Math.min((x.i||0)+1,Q.length)}</td><td>${c.b}</td><td>${c.s}</td><td>${c.h}</td></tr>`}).join('')+'</table>';
}
function tick(){
  if(view!=='quiz'||!P||!S||S.status!=='on'||P.i>=Q.length||P.a[P.i]!==undefined)return;
  ensureT();const q=Q[P.i],lim=T(q.n),r=rem(q),tm=document.getElementById('tm'),tb=document.getElementById('tb');
  if(tm)tm.textContent=fmt(r);
  if(tb){tb.style.width=r/lim*100+'%';tb.className=r<=10?'lo':''}
  if(r<=0){P.a[P.i]='-';save();render()}
}
A.addEventListener('click',e=>{
  const b=e.target.closest('[data-a],[data-h]');if(!b)return;
  if(b.dataset.h){jawab(b.dataset.h);return}
  const a=b.dataset.a;
  if(a==='login')login(document.getElementById('nm').value);
  else if(a==='out')logout();
  else if(a==='next')lanjut();
  else ctl(a);
});
A.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm')login(e.target.value)});
setInterval(tick,500);
render();
(async()=>{
  const cl=window.claude;
  try{db=cl&&cl.use?await cl.use('db'):null}catch(e){db=null}
  if(!db){S=null;if(view!=='login')render();return}
  try{const u=await cl.use('user');owner=u?await u.isOwner():false}catch(e){}
  db.doc('sesi/kelas').onSnapshot(s=>{
    S=s.exists?JSON.parse(JSON.stringify(s.data())):{status:'off',epoch:0,pz:0,pzAt:null};
    sync();if(view==='guru')rCtl();else if(view==='quiz')render();
    if(view==='guru'){subStu();rStu()}
  },()=>{S=null;if(view!=='login')render()});
})();
</script>
</body>
</html>
